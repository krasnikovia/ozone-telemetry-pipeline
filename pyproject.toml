[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-pipeline"
version = "0.1.0"
description = "Real-time Modbus telemetry ingestion and aggregation (Kafka -> Postgres/Parquet)"
requires-python = ">=3.11"
dependencies = [
    "pymodbus==3.16.1",
    "confluent-kafka==2.16.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pyarrow==26.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The test container runs as a non-root user without write access to /app.
addopts = "-p no:cacheprovider"
